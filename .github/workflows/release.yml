name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack the zip
        run: git archive --format=zip --output=LocalServiceManager.zip HEAD

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build ServiceDashboard-Setup.exe
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe was not installed" }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          & $iscc "/DMyAppVersion=$ver" "installer\windows\svcdash.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\ServiceDashboard-Setup.exe, LocalServiceManager.zip, setup.ps1 release-assets\

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: release-assets/
          if-no-files-found: error

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ServiceDashboard.dmg
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash installer/macos/build-dmg.sh "$ver"
          mkdir -p release-assets
          cp dist/ServiceDashboard.dmg release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: [windows-installer, macos-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash installer/publish-release.sh
